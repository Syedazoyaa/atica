name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # publish.yml runs the whole of CI before uploading anything

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pinned, so that a new release of either tool cannot turn an unchanged commit red
      - run: python -m pip install ruff==0.17.6 mypy==2.4.1
      - run: ruff check src tests examples docs
      - run: ruff format --check src tests examples
      - run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # ubuntu-latest (26.04) has no Python 3.9 build, so that one job runs on 24.04
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries Qt needs on a headless Linux runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=atica --cov-report=term-missing

  core-only:
    name: Core without Qt installed (imports and calculations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove the calculation core needs nothing but the standard library
        run: |
          python -m pip install pytest hypothesis
          PYTHONPATH=src python -m pytest tests --ignore=tests/gui -q

  package:
    name: Build, validate and install the distributions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs on a headless Linux runner
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Exactly one wheel and one sdist
        shell: python
        run: |
          import glob
          assert len(glob.glob("dist/*.whl")) == 1 and len(glob.glob("dist/*.tar.gz")) == 1, glob.glob("dist/*")
      - name: Install the wheel in a clean environment and use both components
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ -d "$RUNNER_TEMP/wheel-env/Scripts" ]; then BIN="$RUNNER_TEMP/wheel-env/Scripts"; else BIN="$RUNNER_TEMP/wheel-env/bin"; fi
          "$BIN/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "import atica, atica.units; from atica.units import convert; assert str(convert(25,'kg','g'))=='25000 g'; print('atica', atica.__version__)"
          "$BIN/atica-gui" --version
          "$BIN/atica-gui" --check
          "$BIN/python" -m atica --version
      - name: Install the source distribution in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          if [ -d "$RUNNER_TEMP/sdist-env/Scripts" ]; then BIN="$RUNNER_TEMP/sdist-env/Scripts"; else BIN="$RUNNER_TEMP/sdist-env/bin"; fi
          "$BIN/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$BIN/atica-gui" --check
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
