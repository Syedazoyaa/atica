name: Publish

# Uses PyPI "Trusted Publishing" (OpenID Connect): no API token is stored in the repository.
# One-time setup: add this workflow as a trusted publisher on TestPyPI (and later on PyPI).
#
# SAFE BY DEFAULT: a published GitHub Release uploads to TestPyPI only.  Uploading to the real PyPI
# is a deliberate, separate step: run this workflow manually (workflow_dispatch) on the release tag
# and choose `pypi`.  Nothing is uploaded unless the whole CI workflow passes first.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A release, and any PyPI upload, must come from the tag that matches the package version
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: |
          expected="refs/tags/v$(python -c "import runpy; print(runpy.run_path('src/atica/version.py')['__version__'])")"
          if [ "$GITHUB_REF" != "$expected" ]; then
            echo "::error::Run this from $expected (current ref: $GITHUB_REF)"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist  # the CI run called above already uploads one named "dist"
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi # configure required reviewers on this environment for an explicit approval gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
